<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Video Section</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* Crea el espacio para hacer scroll */
    .scroll-space {
      height: 700vh;
      background: #000;
    }

    /* El video queda fijo en pantalla completa */
    .video-fixed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      z-index: 10;
    }

    #scrollVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="video-fixed">
    <video
      id="scrollVideo"
      src="/videos/hero.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <div class="scroll-space"></div>

  <script>
    const video = document.getElementById("scrollVideo");

    let targetTime = 0;
    let currentTime = 0;
    let videoReady = false;

    video.addEventListener("loadedmetadata", () => {
      videoReady = true;
      video.pause();
      video.currentTime = 0.01;
      updateTargetTime();
      requestAnimationFrame(animateVideo);
    });

    function updateTargetTime() {
      if (!videoReady || !video.duration) return;

      const maxScroll = document.body.scrollHeight - window.innerHeight;
      const progress = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);

      targetTime = video.duration * progress;
    }

    function animateVideo() {
      if (videoReady && video.duration) {
        currentTime += (targetTime - currentTime) * 0.12;

        if (Math.abs(video.currentTime - currentTime) > 0.02) {
          video.currentTime = currentTime;
        }
      }

      requestAnimationFrame(animateVideo);
    }

    window.addEventListener("scroll", updateTargetTime, { passive: true });
    window.addEventListener("resize", updateTargetTime);
  </script>

</body>
</html>
