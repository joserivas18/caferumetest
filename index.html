<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Video Section</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .scroll-space {
      height: 1000vh;
      background: #000;
    }

    .video-fixed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      z-index: 10;
    }

    #scrollVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="video-fixed">
    <video
      id="scrollVideo"
      src="/videos/hero.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <div class="scroll-space"></div>

  <script>
    const video = document.getElementById("scrollVideo");

    let videoReady = false;
    let ticking = false;

    video.addEventListener("loadedmetadata", () => {
      videoReady = true;
      video.pause();
      video.currentTime = 0.01;
      updateVideoByScroll();
    });

    video.addEventListener("canplaythrough", () => {
      videoReady = true;
      updateVideoByScroll();
    });

    function updateVideoByScroll() {
      if (!videoReady || !video.duration) return;

      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const scrollY = window.scrollY || window.pageYOffset;

      let progress = scrollY / maxScroll;
      progress = Math.min(Math.max(progress, 0), 1);

      const targetTime = progress * video.duration;

      try {
        video.currentTime = targetTime;
      } catch (error) {
        console.log("Video seeking error:", error);
      }
    }

    function onScroll() {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          updateVideoByScroll();
          ticking = false;
        });

        ticking = true;
      }
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", updateVideoByScroll);
  </script>

</body>
</html>
