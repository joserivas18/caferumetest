<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Video Section</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .scroll-video-section {
      position: relative;
      height: 600vh;
      background: #000;
    }

    .video-wrapper {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #scrollVideo {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

  <section class="scroll-video-section">
    <div class="video-wrapper">
      <video
        id="scrollVideo"
        src="/videos/hero.mp4"
        muted
        playsinline
        preload="auto"
      ></video>
    </div>
  </section>

  <script>
    const video = document.getElementById("scrollVideo");
    const section = document.querySelector(".scroll-video-section");

    let targetTime = 0;
    let smoothTime = 0;
    let isVideoReady = false;

    video.addEventListener("loadedmetadata", () => {
      isVideoReady = true;
      video.pause();
      video.currentTime = 0.01;
      updateTargetTime();
      requestAnimationFrame(smoothScrollVideo);
    });

    function updateTargetTime() {
      if (!isVideoReady || !video.duration) return;

      const rect = section.getBoundingClientRect();
      const scrollableHeight = section.offsetHeight - window.innerHeight;

      let progress = -rect.top / scrollableHeight;
      progress = Math.min(Math.max(progress, 0), 1);

      targetTime = video.duration * progress;
    }

    function smoothScrollVideo() {
      if (isVideoReady && video.duration) {
        smoothTime += (targetTime - smoothTime) * 0.12;

        if (Math.abs(video.currentTime - smoothTime) > 0.025) {
          video.currentTime = smoothTime;
        }
      }

      requestAnimationFrame(smoothScrollVideo);
    }

    window.addEventListener("scroll", updateTargetTime, { passive: true });
    window.addEventListener("resize", updateTargetTime);
  </script>

</body>
</html>
