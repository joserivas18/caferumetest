<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Scroll</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="scroll-video-section">
    <div class="video-wrapper">
      <video
        id="scrollVideo"
        src="public/videos/hero.mp4"
        muted
        playsinline
        preload="metadata"
      ></video>

      <div class="overlay"></div>

      <div class="content">
        <h1>Rume Café</h1>
        <p>Una experiencia que avanza con cada scroll.</p>
      </div>
    </div>
  </section>

  <section class="next-section">
    <h2>Bienvenido a Rume Café</h2>
    <p>Aquí comienza el contenido de la página.</p>
  </section>

  <script>
    const video = document.getElementById("scrollVideo");
    const section = document.querySelector(".scroll-video-section");

    function updateVideoTime() {
      if (!video.duration) return;

      const rect = section.getBoundingClientRect();
      const scrollableHeight = section.offsetHeight - window.innerHeight;

      let progress = -rect.top / scrollableHeight;
      progress = Math.min(Math.max(progress, 0), 1);

      video.currentTime = progress * video.duration;
    }

    window.addEventListener("scroll", updateVideoTime);
    video.addEventListener("loadedmetadata", updateVideoTime);
  </script>

</body>
</html>
