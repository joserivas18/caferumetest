<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Video Section</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* Esta sección crea el espacio de scroll */
    .scroll-video-section {
      position: relative;
      height: 700vh;
      background: #000;
    }

    /* Esta parte se queda fija mientras haces scroll */
    .video-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* El video ocupa toda la pantalla */
    #scrollVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

  <section class="scroll-video-section" id="scrollSection">
    <div class="video-sticky">
      <video
        id="scrollVideo"
        src="/videos/hero.mp4"
        muted
        playsinline
        preload="auto"
      ></video>
    </div>
  </section>

  <script>
    const video = document.getElementById("scrollVideo");
    const section = document.getElementById("scrollSection");

    let targetTime = 0;
    let currentTime = 0;
    let videoReady = false;

    video.addEventListener("loadedmetadata", () => {
      videoReady = true;
      video.pause();
      video.currentTime = 0.01;
      updateTargetTime();
      requestAnimationFrame(animateVideo);
    });

    function updateTargetTime() {
      if (!videoReady || !video.duration) return;

      const sectionTop = section.offsetTop;
      const sectionHeight = section.offsetHeight;
      const scrollY = window.scrollY;
      const maxScroll = sectionHeight - window.innerHeight;

      let progress = (scrollY - sectionTop) / maxScroll;
      progress = Math.min(Math.max(progress, 0), 1);

      targetTime = video.duration * progress;
    }

    function animateVideo() {
      if (videoReady && video.duration) {
        currentTime += (targetTime - currentTime) * 0.1;

        if (Math.abs(video.currentTime - currentTime) > 0.02) {
          video.currentTime = currentTime;
        }
      }

      requestAnimationFrame(animateVideo);
    }

    window.addEventListener("scroll", updateTargetTime, { passive: true });
    window.addEventListener("resize", updateTargetTime);
  </script>

</body>
</html>
